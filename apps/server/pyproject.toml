[project]
name = "server"
version = "0.2.0"
description = "Demo backend with FastAPI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tomli-w>=1.2.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "google-cloud-speech>=2.28.0",
    "elevenlabs>=2.37.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "aiomysql>=0.2.0",
    "bcrypt>=4.0.1,<4.1",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.8.0",
    "aiofiles>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
